{title:"找到第一个声音",subtitle:"让一小口气，变成一小段音乐",art:"breath",tone:"yellow",tag:"声音的魔法",lessons:[5,6,7,8],goals:["从笛头探索发声","找到声音后再试一次","模仿长短声音和停顿"]},
{title:"三个音成为朋友",subtitle:"B、A、G，住进五线谱的小房子",art:"notes",tone:"blue",tag:"认识五线谱",lessons:[9,10,11,12],goals:["认识五线四间和高音谱号","听、看、吹 B4、A4、G4","完成第一段三音小旋律"]},
{title:"音符走几步",subtitle:"一拍、两拍，还有安静的一拍",goals:["四分音符、二分音符与休止符","小节与 4/4 拍","熟悉三个音的节奏短曲"]},
{title:"手指一起合作",subtitle:"新的音符，一点一点加入",goals:["依次认识 F4、E4、D4","右手换指练习","从已知谱位找相邻音"]},
{title:"旋律向上走",subtitle:"去声音更高的地方看看",goals:["依次认识 C5、D5、E5","音区转换与气流","相邻音和跳进"]},
{title:"节奏有了新伙伴",subtitle:"把一个脚步分成两小步",goals:["成对八分音符与更多休止符","2/4 和 3/4 拍","节奏拼图与接龙"]},
{title:"让音乐连成句子",subtitle:"连起来，也可以轻轻分开",goals:["巩固吐音与学习连音","连音线和乐句","找合适的换气点"]},
{title:"音乐也有表情",subtitle:"轻一点、响一点，讲一个故事",goals:["力度记号与渐强渐弱","速度变化","反复记号与表情小曲"]},
{title:"看懂更多谱面",subtitle:"把小小的记号读明白",goals:["延音线与连音线","附点二分音符","综合读谱与短曲"]},
{title:"音符的小变化",subtitle:"听听，音符变了一点点",goals:["F♯4 与 B♭4","升、降、还原记号","调号的初步认识"]},
{title:"我的小小音乐会",subtitle:"把喜欢的声音分享给家人",goals:["四小节视奏","两小节创编与合奏","两首小曲的家庭音乐会"]}
];
window.LESSONS=[
{id:1,unit:0,title:"你好，我的长笛",duration:"5 分钟",kind:"parts",goal:"认识弯头、吹孔和按键。",say:"这是你的音乐新朋友。弯弯的笛头，让吹孔离小手更近一点。",steps:["和大人一起，把笛盒平放在桌上打开。","找一找弯弯的笛头，再找小小的吹孔。","看看一排圆圆的按键。今天先轻轻观察。"],practice:"长笛找朋友",task:"声音从哪里开始呢？找出我们吹气的地方。",choices:["吹孔","笛盒","清洁布"],answer:0,feedback:"找到了！我们让气流掠过吹孔的边缘，来寻找声音。",parent:"按实际型号介绍笛头和笛身。有些儿童长笛的管节与按键不同，以自己的乐器为准。让孩子指出部位即可，不急着吹。",check:"能指出吹孔，并知道按键要轻轻对待。"},
{id:2,unit:0,title:"给长笛一个舒服的家",duration:"5 分钟",kind:"care",goal:"练习安全取放和练后收好。",say:"长笛也需要被温柔照顾。握住没有按键的管子，让大人陪你慢慢来。",steps:["请大人先示范：拿没有按键的管段，不用手挤压按键。","组装时让大人扶好、对齐。遇到卡住，就先停下来。","练完请大人按说明清洁，再把长笛放回自己的位置。"],practice:"温柔的小选择",task:"组装时，应该握哪里？",choices:["紧紧抓住按键","没有按键的管段","拉住细细的连杆"],answer:1,feedback:"对啦，握住合适的无按键管段，让大人帮助你。",parent:"成人负责初期组装。弯管的清洁方法按厂家说明，避免强行插入清洁杆；不拧螺丝、不挤按键。",check:"知道卡住时停下，并请大人帮忙。"},
{id:3,unit:0,title:"小树站稳，肩膀放松",duration:"5 分钟",kind:"posture",goal:"找到脚踏实、头自然、肩膀放松的感觉。",say:"像一棵舒服的小树，脚踩稳，头轻轻长高，肩膀不用往上跑。",steps:["先不拿长笛，双脚舒服地踩在地上。坐着时也让脚有支撑。","耸一下肩，再慢慢放下，感觉肩膀变松。","请大人帮你拿好长笛；按老师调整的角度，短短试一会儿。"],practice:"舒服，还是不舒服？",task:"手臂已经累了，我们可以怎么做？",choices:["再坚持很久","先放下长笛休息","把肩膀越抬越高"],answer:1,feedback:"当然可以休息。舒服的小身体，才能慢慢学会音乐。",parent:"此图只提示放松与站坐，不规定弯头旋转角度、支点或手臂角度。请老师根据孩子本人和具体型号调整。",check:"能说出哪里累，愿意及时放下乐器。"},
{id:4,unit:0,title:"准备出发的小音乐家",duration:"6 分钟",kind:"listen",goal:"复习取放和姿势，听一听声音的高低。",say:"今天我们做个小侦探。耳朵听一听，身体也检查一下：我舒服吗？",steps:["指出吹孔，再请大人帮助检查长笛是否放稳。","把肩膀放松，脚踏实；还不用开始吹。","点一下“听示范”，听两个声音：后一个更高，还是更低？"],demo:["G4","B4"],practice:"声音往哪里走？",task:"听过示范后，选一选。",choices:["第二个声音更高","第二个声音更低"],answer:0,feedback:"耳朵发现了：第二个声音更高。高低和响不响是两件事。",parent:"示范使用相近响度的电子音，只用于听辨音高。可以重复播放，不要求孩子记音名。",check:"能初步听出高低，并复习舒服的准备动作。"},
{id:5,unit:1,title:"让小气流去旅行",duration:"5 分钟",kind:"air",goal:"在成人陪伴下，用笛头探索发声。",say:"下唇轻轻靠着唇板，让一小股气流掠过吹孔的边缘。我们一起找找声音。",steps:["先请老师示范并确认吹孔和下唇的位置；家长陪同练习。","自然吸一口气，短短试吹一下。先不组装整支笛。","如果只有气声，就停一下，再小幅调整位置试试。"],practice:"今天的小发现",task:"暂时只有气声，应该怎么办？",choices:["用力猛吹","休息后，轻轻调整再试"],answer:1,feedback:"找声音需要一点时间。轻轻调整，每次只试短短一下。",parent:"气流图是方向概念示意，不是口型的精确角度模板。初学者发声需个别调整；不要求微笑拉紧嘴角，不做憋气比赛。",check:"愿意尝试，并能在短练习之间自然休息。"},
{id:6,unit:1,title:"我还能再找到它",duration:"5 分钟",kind:"air",goal:"在休息后，再次找到刚才的声音。",say:"刚才的声音很可爱。放下笛头歇一歇，我们再邀请它来一次。",steps:["找到声音后，记住下唇接触唇板的舒服感觉。","放下笛头，自然呼吸，再按刚才的位置试一次。","做两三次短尝试，哪一次更容易？和大人说说。"],practice:"给自己一片小叶子",task:"你今天有什么发现？每个发现都值得记住。",choices:["我找到一次声音","我知道还想试哪里","今天想先休息"],answer:"any",feedback:"发现已经收好。学音乐可以慢慢来，我们下一次再试。",parent:"以能重复找到声音为方向，不限定必须几秒或本课完成。持续只有气声时请老师检查口型与笛头，不靠增加练习时长解决。",check:"能在休息后重新尝试，或说出自己的感受。"},
{id:7,unit:1,title:"声音也会走小步",duration:"6 分钟",kind:"rhythm",goal:"模仿短声音、稍长的声音和停顿。",say:"短短一声，长一点点，再安静一下。声音也可以走出不同的脚步。",steps:["先用嘴说“嘟——嘟”，再拍拍同样的节奏。","听电子示范：短、短、长一点点。用拍手模仿。","请老师示范轻吐音，再在笛头上短短试一下。安静时正常呼吸。"],demo:["B4","B4","B4"],durations:[.35,.35,.75],practice:"听完，再试一次",task:"声音变长了，是不是就一定更响？",choices:["是，越长越响","不是，长短与强弱不同"],answer:1,feedback:"对啦，声音可以又长又轻。今天只玩长短，不需要吹得很响。",parent:"这里先用图形感受时长，不背音符定义。轻吐音应由老师示范；保持气流自然，避免用力顶舌。",check:"能拍出短、短、稍长的节奏。"},
{id:8,unit:1,title:"你一句，我一句",duration:"6 分钟",kind:"rhythm",goal:"听完一个短声音句子，再回应。",say:"我说一句音乐，你也说一句音乐。先听完，再轮到你。",steps:["点示范，先听两遍：短、长、短。","用拍手回应，安静的时候也等一等。","如果笛头发声已稳定，就吹一个自己的声音句子。"],demo:["B4","B4","B4"],durations:[.3,.6,.3],practice:"轮到谁说话？",task:"大人的音乐句子还没有结束，我们先做什么？",choices:["认真听完","马上一起吹得更响"],answer:0,feedback:"先听完，再回应。你已经开始和别人一起玩音乐了。",parent:"一次模仿两三个声音即可。可交替用拍手、哼唱和笛头，避免一直举着乐器。",check:"能等待示范结束，再模仿一个短句。"},
{id:9,unit:2,title:"B 住在第三条线",duration:"7 分钟",kind:"note",note:"B4",goal:"认识 B4 的谱位、声音和基本指法。",say:"五线谱有五条线。从下面数，B 的小脑袋坐在第三条线上。",steps:["先数五条线，再找线中间的四个空隙。看到前面的高音谱号了吗？","点 B 听声音，再看指法图：左拇指、左食指按下；通常右小指也按下。","由老师确认支点后，轻轻吹 B。只短短试几次，然后休息。"],demo:["B4"],practice:"B 的小房子",task:"从下面数，B4 在哪里？",choices:["第一条线","第三条线","第五条线"],answer:1,feedback:"找到啦！B4 的符头被第三条线穿过。",parent:"指法图采用常见波姆体系长笛：左拇指使用 B 本位音键，不是降 B 拇指键。右小指通常按降 E 键；儿童特殊型号由老师确认。",check:"能找到 B4 的谱位，并在帮助下尝试正确指法。"},
{id:10,unit:2,title:"A 住在第二个间",duration:"7 分钟",kind:"note",note:"A4",goal:"认识 A4，并与 B4 对比。",say:"A 住在线和线的中间。从下面数，它在第二个间里，比 B 低一点。",steps:["先找到昨天的 B，再往下一小步，找到 A。","点 A 和 B 听一听。看指法图：在 B 的基础上，再按左中指。","先不吹气，轻轻换 B、A 的手指，再试两个短声音。"],demo:["B4","A4"],practice:"A 在哪里？",task:"从下面数，A4 住在……",choices:["第二个间","第三条线","第四个间"],answer:0,feedback:"对啦，A4 在第二间。间就是两条线中间的空隙。",parent:"左拇指、左食指、左中指及通常按下的右小指参与 A4 指法。保持原先支点，换指不需要抬得很高。",check:"能分清 B 在线上、A 在间里。"},
{id:11,unit:2,title:"G 坐上第二条线",duration:"7 分钟",kind:"note",note:"G4",goal:"认识 G4，连接 B4、A4、G4。",say:"再往下一小步，就遇见 G。它坐在第二条线上，高音谱号也会帮我们认出它。",steps:["从最下面数：第一条线、第二条线。G 的符头就在这里。","在 A 的基础上，再按左无名指。保持右手轻轻支撑。","先静默换指，再慢慢试 B、A、G。每个音之间可以休息。"],demo:["B4","A4","G4"],practice:"给 G 找位置",task:"G4 的符头坐在哪里？",choices:["第二个间","第二条线","第三条线"],answer:1,feedback:"找到 G 了！高音谱号的中心卷曲围着的，也是这条线。",parent:"G4 使用左拇指、左食指、中指、无名指及通常按下的右小指。左手按键增加时留意握紧与耸肩，必要时先静默练习。",check:"能把 G4 的声音、谱位和指法联系起来。"},
{id:12,unit:2,title:"三位朋友的小旅行",duration:"8 分钟",kind:"melody",goal:"读出并尝试一段 B、A、G 小旋律。",say:"B、A、G 都来了！让我们看着谱，一步一步，把它们连成小音乐。",steps:["指着谱，慢慢说出 B、A、G 的名字，先不吹。","听示范，再跟着做静默指法。也可以一小句一小句练。","选舒服的速度吹一遍。哪里想再试，就只练那一小段。"],demo:["B4","A4","G4","A4","B4","A4","G4"],practice:"我想分享的小发现",task:"今天最想告诉家人什么？",choices:["我认出了三个音","我吹出一小段音乐","我想再玩一次"],answer:"any",feedback:"每一种发现都很好。你可以把这段音乐送给家人听。",parent:"谱面使用等长音符展示音序，正式时值在下一单元学习。此时允许停顿与分句；不要求一口气吹完，也不以电子音色为模仿目标。",check:"能读出三音片段，尝试分句吹奏。"}
];

/* Complete curriculum; original exercises, quarter-note beat throughout. */

S("musical-sentence",4,[[N("E4"),N("F4"),N("G4"),R(1)],[N("A4"),N("B4"),N("C5"),R(1)],[N("C5"),N("B4"),N("A4"),N("G4")],[N("F4"),N("E4",2),R(1)]],{slurs:[{bar:0,from:0,to:2},{bar:2,from:0,to:3}],breaths:[{bar:1,after:2}]});

const advanced=[
{id:13,title:"一拍声音，一拍安静",goal:"认识四分音符和四分休止符。",say:"黑黑的符头带着一根小竖线。今天它走一拍；遇到休止符，声音停了，心里的脚步还在。",steps:["先跟着大人均匀拍四下，说“一、二、三、四”。","看谱：第一拍吹 G，第二拍安静，第三拍再吹 G，第四拍安静。","先拍和指谱，再短短吹一遍。安静时自然呼吸。"],score:"quarter",diagram:"quarter",practice:"安静也占位置",task:"遇到一拍休止符，要不要把这一拍跳过去？",choices:["直接跳过","保持一拍安静，再往下走"],answer:1,feedback:"对，安静也占一拍。心里的拍子继续走。",parent:"本课及主线示例均以四分音符为一拍。别把“一拍”解释成固定一秒；先保持相同间隔。",check:"能让休止符保留一拍，而不是抢着吹下一音。"},
{id:14,title:"一个声音陪我走两拍",goal:"认识二分音符，持续两拍。",say:"空心的符头带着一根小竖线，是二分音符。一个声音，陪我们走两拍。",steps:["看空心和实心符头有什么不同。","播放示范。数“一、二”的时候，G 的声音一直在，没有重新开始。","先哼唱再吹；如果气不舒服，就用拍手和声音条练习。"],score:"half",diagram:"half",practice:"一个音，还是两个音？",task:"二分音符占两拍，要重新吐音两次吗？",choices:["不用，持续一个声音","需要，两拍吹成两声"],answer:0,feedback:"一个声音持续两拍。下一音到来前，不重新起音。",parent:"不要把两个四分音符与一个二分音符混为一谈。数拍保持匀速，音头只一次。",check:"能听出持续两拍与分别吹两声的差别。"},
{id:15,title:"四拍住在一间小房子",goal:"认识小节线与 4/4 拍号。",say:"小节线像小房子的墙。看到四四拍，我们把四个脚步分成一组。",steps:["找到谱子左边上下两个 4：上面的 4 表示每小节四拍。","下面的 4 表示以四分音符为一拍。每过一条小节线，重新数一。","先指谱数完两小节，再听、再吹。小节线本身不用停顿。"],score:"bar",diagram:"meter4",practice:"小房子的脚步",task:"4/4 拍的一小节，应该装几拍？",choices:["两拍","四拍","看到几个音符就几拍"],answer:1,feedback:"每小节四拍。音符数量可以不同，总时值要装满四拍。",parent:"拍号不表示每小节一定四个音符。长音和休止符都计入拍数，小节线不自动增加时长。",check:"能边指谱边数每小节的四拍。"},
{id:16,title:"三位朋友的节奏小曲",goal:"用 B、A、G 综合一拍、两拍和停顿。",say:"音符住在哪里，告诉我们吹哪个音；音符长什么样，告诉我们吹多久。",steps:["先说音名，找到所有空心音符和休止符。","只拍节奏，再做静默指法。一次先练两小节。","点示范后慢慢吹，休止符那里也等够拍子。"],score:"three-friends",practice:"两个问题都要看",task:"读谱时，我们既要看音高，还要看什么？",choices:["声音的长短和停顿","只看符头颜色"],answer:0,feedback:"音高和节奏一起看，音乐才能认出自己的样子。",parent:"四小节原创练习。一次只反馈一个重点；换指不稳时，先单练音序，再恢复节奏。",check:"能较慢地完成含长音与休止的短句。"},
{id:17,title:"右手来帮忙，认识 F",note:"F4",goal:"认识 F4 的谱位与标准指法。",say:"F 住在最下面的第一个间里。右手食指轻轻加入，就多了一位音符朋友。",steps:["从下面数，找到第一间，比 G 低一小步。","先看指法：左手拇指和三个手指按下，右食指与右小指按下。","先做 G—F—G 的静默换指，再短短吹。"],score:"new-f",practice:"谁加入了？",task:"从 G4 换到 F4，主要新按下的是哪个手指？",choices:["右手食指","左手食指","右手拇指"],answer:0,feedback:"右食指加入。右拇指继续轻轻支撑乐器。",parent:"F4 指法为 T123 / 1-- + 右降 E 键。勿把右手拇指误当作按音键的手指。",check:"能定位第一间，并让右食指轻轻换动。"},
{id:18,title:"E 坐在最下面的线上",note:"E4",goal:"认识 E4，协调右食指与中指。",say:"E 坐在第一条线上。它比 F 更低一点，右手中指也来帮忙了。",steps:["找到最下面的第一条线，看看符头被线穿过。","从 F 的指法再按下右中指，其他已按下的手指保持轻松。","先试 F—E—F，再吹谱里的三个短音。"],score:"new-e",practice:"线，还是间？",task:"E4 的小脑袋在哪里？",choices:["第一间","第一条线"],answer:1,feedback:"E4 在第一条线，F4 在第一间，相邻但不一样。",parent:"E4 为 T123 / 12- + 右降 E 键。低音气流与口型需要个别指导，不让孩子靠加大力度寻找声音。",check:"能区分 E4 与 F4 的谱位。"},
{id:19,title:"找到低一点的 D",note:"D4",goal:"认识 D4，并注意右小指离键。",say:"D 躲在第一条线的下面。右手三个手指都来帮忙，右小指却可以轻轻离开自己的键。",steps:["找到第一线下面的空位；这个 D4 不需要加线。","看指法：左拇指和左三个手指按下，右食、中、无名指按下，右小指离键。","先做 E—D 的换指，再请老师听一听低 D 的声音。"],score:"new-d",practice:"特别的小提醒",task:"吹 D4 时，右小指的降 E 键通常怎样？",choices:["按下","放开"],answer:1,feedback:"D4 通常放开右小指的降 E 键。其他手指要继续轻轻按好。",parent:"D4 为 T123 / 123，右小指不按降 E 键。请老师检查乐器密合和支撑；此音较难时先停留，不强吹。",check:"记得 D4 的右小指与 E4 不同。"},
{id:20,title:"走过森林的小台阶",goal:"复习 D4、E4、F4、G4 的上下行。",say:"音乐可以一步步往下走，也能转身走回来。眼睛看下一步，手指慢慢跟上。",steps:["先找谱里的最低音 D4 和最高音 G4。","分两小节练静默指法，特别看 D 与 E 之间右小指的变化。","先听，再选舒服的速度吹。下行、上行各试一小段。"],score:"forest-steps",practice:"遇到难走的一步",task:"E—D 总是卡住，我们先怎么练？",choices:["把整首越吹越快","只把 E—D 慢慢练几次"],answer:1,feedback:"把难的一小步拿出来，慢慢走顺，再放回音乐里。",parent:"低音区回顾。保持各音音色自然，先建立手指协调，再追求连贯。",check:"能识别并单练最容易卡住的一次换指。"},
{id:21,title:"C 搬到更高的房间",note:"C5",goal:"认识 C5，学习左拇指离键后的平衡。",say:"B 再往上一小步，就是 C。它住在第三间；左拇指松开按键，长笛仍要轻轻放稳。",steps:["先找 B 的第三线，再找上面的第三间。这里是 C5，不是更低的中央 C。","指法只保留左食指和通常按下的右小指，其余音键放开。","让老师确认支撑，再静默换 B—C，短短试吹。"],score:"new-c5",practice:"别忘了左拇指",task:"从 B4 换到 C5，左拇指的 B 键怎样？",choices:["放开","继续按下"],answer:0,feedback:"左拇指放开 B 键，其他支点继续让长笛保持平衡。",parent:"C5 为 -1-- / --- + 右降 E 键。不要用捏紧左食指补偿拇指离键；先由老师确认支点。",check:"能定位 C5，并在帮助下保持平衡。"},
{id:22,title:"认识高一点的 D",note:"D5",goal:"区分 D5 与 D4 的谱位和指法。",say:"这也是 D，但住得更高，在第四条线上。高低不同，手指也有一个小变化。",steps:["对比低 D4 和第四线上的 D5，听听它们相隔一个八度。","D5 左拇指、左中指、左无名指按下；左食指放开。右三个手指按下，右小指放开。","请老师帮助调整气流方向与集中程度，别用猛吹代替调整。"],score:"new-d5",practice:"两个 D 的区别",task:"从 D4 的基本指法到 D5，左食指通常怎样？",choices:["放开","继续按下不变"],answer:0,feedback:"D5 通常抬起左食指。右小指在这两个 D 上都离开降 E 键。",parent:"D5 为 T-23 / 123，右降 E 键不按。不要把 D4 指法照搬成标准 D5 指法；由老师指导音区转换。",check:"能指出两个 D 的不同谱位和左食指变化。"},
{id:23,title:"E 也有高高的声音",note:"E5",goal:"认识 E5，体验同指法的不同音区。",say:"高一点的 E 住在第四间。手指和低 E 很像，气流却要和老师一起细细调整。",steps:["在第四线与第五线之间找到 E5。","按 E4 的基本指法：左拇指和左三个手指、右食指和中指、右小指按下。","先听 D5—E5—D5，再在老师指导下短试，声音紧了就休息。"],score:"new-e5",practice:"同指法，一定同声音吗？",task:"E4 和 E5 的基本指法相同，音高也一样吗？",choices:["一样","不一样，相差一个八度"],answer:1,feedback:"手指相同也能有不同音区；耳朵和气流都要一起学习。",parent:"E5 基本指法与 E4 相同。不同音区依赖气流和口型协调，不等于更大音量。",check:"知道指法相同并不代表音高一定相同。"},
{id:24,title:"去高高的树枝看看",goal:"把 G4 至 E5 的已学音连接起来。",say:"沿着音符的台阶往上走，到树枝上看看，再慢慢回家。",steps:["先沿谱读 G、A、B、C、D、E，指一指最高的 E5。","分句做静默换指，特别留意 C5 到 D5。","按小句吹奏，在休止处休息；高音不稳时先返回单音。"],score:"high-branch",practice:"高音不是大声",task:"高音暂时不出来，我们要一直猛吹吗？",choices:["不用，停下并请老师帮助调整","要，越大力越好"],answer:0,feedback:"先舒服地调整，再试一次。高低和强弱是不同的。",parent:"复习 C5 平衡、D5 左食指离键、E5 音区转换。必要时降低新内容量。",check:"能用分句而不是憋气的方式完成上下行。"},
{id:25,title:"一拍变成两小步",goal:"认识成对八分音符。",say:"一个大脚步里，可以均匀放进两小步。两个八分音符，加起来正好一拍。",steps:["大人慢慢拍一拍，你在同样长的时间里均匀说“哒哒”。","看连接两枚音符的小横线：这一对在本课占一拍。","先拍节奏，再做指法，最后吹。两小步一样长。"],score:"eighth",diagram:"eighth",practice:"两小步装在哪儿？",task:"以四分音符为一拍时，两个八分音符共占几拍？",choices:["一拍","两拍"],answer:0,feedback:"两个半拍，合起来是一拍。不是把整首音乐突然加快。",parent:"先分拍，再加换指；不要用“一拍一个音”的旧习惯拍八分音符。示例均成对且按拍分组。",check:"能在同一拍内均匀放下两个短音。"},
{id:26,title:"长声音和长安静",goal:"认识全音符、二分休止符和全休止符。",say:"没有小竖线的空心音符，陪我们走四拍。安静也可以很长，不一定只停一拍。",steps:["在 4/4 拍里看全音符，持续数一二三四，只有一个音头。","看二分休止符坐在线上，停两拍；全休止符挂在线下，本例整小节安静四拍。","先听和指谱；吹长音可以先做短一点的练习，不比赛气长。"],score:"long-rests",diagram:"rests",practice:"休止符也要数",task:"4/4 拍里，整小节的全休止符要安静多久？",choices:["一拍","四拍"],answer:1,feedback:"这个小节四拍都安静，下一小节再进入。",parent:"全休止符也可表示整小节休止，在其他拍号下不一定四拍。这里统一用 4/4；不把图形与固定秒数绑定。",check:"能区分两拍安静与整小节安静。"},
{id:27,title:"两拍一组，三拍一组",goal:"体验 2/4 与 3/4 的分组。",say:"小房子也有不同大小。有的装两拍，有的装三拍；脚步仍然一样稳。",steps:["先听两拍一组，边走边说“一二、一二”。","再听三拍一组，轻轻摆动，说“一二三、一二三”。","看两种谱子。下方的 4 没变，每拍仍是四分音符。"],score:"two-beat",compare:[["听两拍一组","two-beat"],["听三拍一组","three-beat"]],diagram:"meter23",practice:"看上面的数字",task:"3/4 拍的一小节有几拍？",choices:["三拍","四拍"],answer:0,feedback:"上面的 3 告诉我们每小节三拍，下面的 4 说明一拍的单位。",parent:"第一拍有分组重心，不要求孩子每小节猛吹一下。拍速保持相近来比较拍号。",check:"能用拍手或走步体验两拍与三拍的分组。"},
{id:28,title:"节奏朋友一起出游",goal:"综合八分音符、长音与休止。",say:"短短的两小步，和长一点的声音，都要住进三拍的小房子里。",steps:["先找拍号，再逐小节数拍。遇到一对八分音符，放在同一拍里。","把音名暂时放一边，只拍节奏。","接着分两小节做指法、听示范、慢速吹。"],score:"rhythm-walk",practice:"装满一间小房子",task:"一对八分音符加一个二分音符，共几拍？",choices:["两拍","三拍","四拍"],answer:1,feedback:"半拍加半拍是一拍，再加两拍，正好三拍。",parent:"本课 3/4 小节总和都为三拍。若换指影响均分，先在一个音上练节奏。",check:"能保持八分音符均匀，休止时不抢拍。"},
{id:29,title:"舌头轻轻说个嘟",goal:"巩固轻吐音，让起音清楚。",say:"像轻轻说“嘟”，给每个声音一个清楚的开头。不是用舌头用力撞一下。",steps:["请老师示范舌头怎样轻轻开始声音，先模仿两三次。","用一个 G，跟谱吹三次短声音，中间正常保持身体放松。","听电子音的分开效果，再听老师的真实吐音；两种音色不需要一样。"],score:"tongue",practice:"起音要多用力？",task:"想让声音开头清楚，应该用力顶舌吗？",choices:["不用，动作轻巧并跟老师示范","要，越重越清楚"],answer:0,feedback:"小动作也能有清楚的开始。不要把喉咙和嘴唇都绷紧。",parent:"中文“嘟”只是儿童提示，具体舌位跟随教师。避免每音都靠重新猛吹或喉部挤压起音。",check:"能在舒适状态下做几个较清楚的单吐音。"},
{id:30,title:"一口小气流连起三个音",goal:"认识连音线，体验不同音之间连贯转换。",say:"弯弯的连音线把三个不同的音抱在一起。第一个轻轻开始，后面的手指接着走。",steps:["先听分开起音，再听连起来的电子效果，比较中间的小空隙。","找从 G 跨到 B 的连音线。线内换音时不重新吐舌。","先静默换指 G—A—B，再短短连起来吹。"],score:"legato",compare:[["分开起音","separate"],["连起来","legato"]],diagram:"slur",practice:"连音线里怎么换音？",task:"这条线连着不同音，后面每个音都重新吐舌吗？",choices:["不用，每个音仍按自己的时值继续","每个都用力吐一下"],answer:0,feedback:"第一个起音后，用连贯气流配合换指。各音时值仍然要数对。",parent:"电子示例用连续振荡与分开包络对比连贯感，不模拟真实口型。连音不等于滑音，也不等于每音一样长。",check:"能听出并尝试连音与分开起音的差别。"},
{id:31,title:"音乐在哪里换口气",goal:"观察乐句和预先安排换气。",say:"说话要换气，音乐也一样。先看看在哪里休息，再开始讲这句音乐。",steps:["找谱上的小逗号和它后面的休止符。","先唱出一句，在预定位置自然吸气，不把肩膀往上提。","分两句吹。气不够时告诉老师，一起安排更短的乐句。"],score:"breathing",practice:"换气要等到很难受吗？",task:"已经觉得气不舒服了，要强撑到句末吗？",choices:["不要，先停下并调整句长","要，必须撑住"],answer:0,feedback:"舒服地呼吸更重要。我们可以把音乐先分成更小的句子。",parent:"本例换气安排在休止前，实际吸气在休止中完成。呼吸记号本身不机械增加一拍；不强调憋气或把肺装满。",check:"开始前能指出准备换气的位置。"},
{id:32,title:"用音乐说一个小故事",goal:"综合连音、分开起音和换气。",say:"有的词连着说，有的词轻轻分开。用两种声音，讲同一个小故事。",steps:["找出有连音线的两段，其他音按轻吐音尝试。","先听整段，再只练有连音线的一句。","和大人轮流听、吹；一次只说一个发现。"],score:"musical-sentence",practice:"今天想先改哪里？",task:"如果手指、吐音和换气都不熟，要一次全部改好吗？",choices:["先选一个重点，分句练","一遍同时纠正全部"],answer:0,feedback:"一次练清楚一个重点，下一次再照顾另一个。",parent:"将音符与动作组合，不增加新音。连音线内保持音高变化明确，避免意外滑音。",check:"能在两种连接方式之间做有意识的选择。"},
{id:33,title:"轻轻说，也能听清楚",goal:"认识 p、mf、f 的相对力度。",say:"同一段音乐，可以轻轻说，也可以更有精神地说。声音的高低没有因此换成别的音。",steps:["依次听 p、mf、f 三个示范，音名和节奏完全相同。","p 表示弱，mf 表示中强，f 表示强；先感受相对变化。","让老师帮助，在舒服音量里尝试两种力度，不挤嘴、不猛吹。"],score:"medium",compare:[["p 轻一些","soft"],["mf 中等","medium"],["f 响一些","loud"]],diagram:"dynamics",practice:"力度改变什么？",task:"同一个 G，从 p 变成 f，主要改变的是……",choices:["响一些，不是换成更高的音","一定变成 A"],answer:0,feedback:"力度改变响度。音高、节奏仍要保持原来的样子。",parent:"设备音量固定后比较；力度是相对表达，电子音不提供真实分贝标准。初学可先比较 p 与 mf。",check:"能把音高、时长与力度区分开。"},
{id:34,title:"声音慢慢长大，又变小",goal:"体验渐强与渐弱。",say:"声音可以像花慢慢打开，也可以慢慢合上。是逐渐变化，不是突然喊一下。",steps:["看张开的符号，听音量逐渐变大；看合拢的符号，听逐渐变小。","用说话或哼唱先模仿一遍，音高不要跟着随意改变。","在老师帮助下用短句尝试，保持身体放松。"],score:"crescendo",diagram:"wedges",practice:"慢慢变化",task:"渐强最像哪一种变化？",choices:["突然大喊一声","逐渐从轻变响"],answer:1,feedback:"一点一点变响，才是渐强。渐弱则慢慢变轻。",parent:"先用短句体验相对强弱。较弱时保持有支撑的声音，不以漏气代替弱奏。",check:"能听出突然改变与渐渐改变的区别。"},
{id:35,title:"同一首音乐，不同脚步",goal:"区别速度与力度，认识拍速。",say:"同样的音符，脚步慢一点或快一点，音乐的感觉就会不同。快不代表更大声。",steps:["听两个示范：每分钟 50 拍与 80 拍，声音强弱保持相近。","跟着拍手，感受每一拍的间隔。今天不需要记住数字。","在曲谱盒里调慢速度，先把一小句吹清楚。"],score:"slow",compare:[["慢一点 · 50 拍/分","slow"],["快一点 · 80 拍/分","quicker"]],diagram:"tempo",practice:"拍子快了会怎样？",task:"每分钟拍数增加时，每两拍之间的时间会……",choices:["变短","变长"],answer:0,feedback:"脚步更密，每拍间隔变短；音符之间的长短比例仍保持。",parent:"示例 50 与 80 是本课练习速度，不把它们当作所有速度术语的唯一数值。速度和力度分别演示。",check:"知道遇到困难可以先降低速度。"},
{id:36,title:"这段音乐，再走一遍",goal:"认识成对反复记号并按路线演奏。",say:"走到带小点点的终点，就回到带小点点的起点，把中间的音乐再走一次。",steps:["找开头与末尾的反复记号，看清两颗点的位置。","用手指走路线：第一小节、第二小节，再第一、第二小节。","听示范确认重复两次，再按同样路线吹。"],score:"repeat",diagram:"repeat",practice:"会走几次？",task:"本课这对反复记号内的两小节，总共奏几遍？",choices:["一遍","两遍"],answer:1,feedback:"先奏一遍，再回去奏一遍。本课共四小节的播放长度。",parent:"这里只教一对普通反复记号，不含第一、第二房子或其他返始记号。电子播放会真实重复。",check:"能用手指走对重复路线。"},
{id:37,title:"两个同音，牵成一个长音",goal:"认识延音线并与连音线区分。",say:"两个一样高的音牵着手，可以合成一个更长的声音。后一个音不重新说“嘟”。",steps:["找跨过小节线的两个 G，看它们的谱位是否相同。","这两个 G 各一拍，延音线让它们合起来持续两拍。","再比较上一单元连着 G、A、B 的线：不同音要换指，延音线连接同音。"],score:"tie",compare:[["同音持续 · 延音线","tie"],["不同音连贯 · 连音线","legato"]],diagram:"tie",practice:"后一个 G 怎么吹？",task:"延音线连接的后一个 G，要重新起音吗？",choices:["不用，持续原来的声音","要，重新吹一下"],answer:0,feedback:"一个声音跨过小节线，拍子继续数，后一个 G 不重新起音。",parent:"延音线连接同音高音符并相加时值，临时变音跨线连音的特殊延续以后再学；本例无变音。",check:"能说出延音线与不同音之间连音线的差别。"},
{id:38,title:"小圆点，让声音多待一会儿",goal:"认识附点二分音符的三拍时值。",say:"二分音符旁边多一个小圆点，它就多待原来一半的时间：两拍，再加一拍。",steps:["找到空心符头、符干和右边的小点，别把小点当成新的音符。","在 3/4 中持续数一二三，一个附点二分音符正好占满一小节。","先唱、再听，最后短短试吹；可以先用拍手完成。"],score:"dotted",diagram:"dotted",practice:"两拍，加一半",task:"以四分音符为一拍时，附点二分音符占……",choices:["两拍","三拍","四拍"],answer:1,feedback:"两拍加一拍，一共三拍。附点不是每次固定加一拍，要看原音符。",parent:"本课只练附点二分。说明附点增加原时值的一半，避免形成“有点就加一拍”的错误概念。",check:"能把三拍持续成一个音，不在点的位置重新起音。"},
{id:39,title:"眼睛看下一步",goal:"读出级进与简单跳进。",say:"有时音符走到隔壁，有时跳过一个小台阶。眼睛可以先看看下一位朋友在哪里。",steps:["第一小节从 G、A、B 到 C，沿谱位一步一步上行。","第二小节 G 到 B 跳过 A。先指谱说音名，再做指法。","分句慢吹，眼睛稍微看前面，不需要赶速度。"],score:"step-skip",diagram:"interval",practice:"这次跨过了谁？",task:"从 G4 走到 B4，中间跳过了哪个自然音？",choices:["A4","E4"],answer:0,feedback:"G—A—B 中间是 A。跳进时尤其要看清目标谱位。",parent:"先建立相邻与跳进的视觉关系，不必此刻背所有音程名称。不要用猜旋律代替看谱。",check:"能把相邻移动和跳过一步区分开。"},
{id:40,title:"带着小记号去野餐",goal:"综合三拍、附点、延音与连音。",say:"小记号都在帮忙。先看拍号，再看音符，最后看看谁牵着手、谁要多待一会儿。",steps:["先找 3/4，再标出跨小节线的两个 A 和最后的附点音符。","只拍节奏：延音线里的第二个 A 不另起音，但仍占一拍。","分两小节听、唱、做指法，再慢吹完整四小节。"],score:"reading-picnic",practice:"遇到好多记号",task:"读新谱时，先做哪件事更有帮助？",choices:["先看拍号和难点，再分句练","立刻从头快速吹"],answer:0,feedback:"先找到路标，再慢慢走。复杂一点的谱也能拆成小任务。",parent:"注意区分跨小节延音与同小节连音，音头数不等于拍数；最后附点二分占三拍。",check:"能在开始前指出谱里的至少两个关键记号。"},
{id:41,title:"F 往上挪半小步",note:"F#4",goal:"认识升号和 F♯4 指法。",say:"F 前面来了一个升号，它变成升 F，音高升了半音。小脑袋仍然住在 F 的位置。",steps:["先听 F、升 F、G，感受中间的新声音。","升 F4 左手 T123 按下，右手只按无名指和通常按下的右小指。","从普通 F 换过来时，右食指放开、无名指按下，先静默试。"],score:"sharp",practice:"升号改变什么？",task:"F4 变成 F♯4，符头要搬到 G 的谱位吗？",choices:["不搬，仍在 F 的位置，加升号","要，直接画到 G 上"],answer:0,feedback:"升号改变音高半音，符头仍按 F 的线间位置书写。",parent:"F♯4 标准初学指法 T123 / --3 + 右降 E 键，不是只按右食指的 F4。",check:"能比较 F 与 F♯ 的右手差异。"},
{id:42,title:"B 往下挪半小步",note:"Bb4",goal:"认识降号和 B♭4 的 1+1 指法。",say:"B 前面来了一个降号，变成降 B。它比 B 低半音，但仍住在第三条线上。",steps:["先听 B、降 B、A，比较相邻的声音。","本课使用 1+1 指法：左拇指按 B 本位键、左食指、右食指和右小指按下。","从 B 到降 B，让右食指轻轻加入。不要同时换成别的降 B 指法。"],score:"flat",practice:"多了一根手指",task:"使用本课 1+1 指法，从 B4 到 B♭4，主要加哪根手指？",choices:["右食指","右无名指"],answer:0,feedback:"右食指加入。这个叫 1+1 的降 B 指法。",parent:"降 B 有多种常用指法。本课固定 T1-- / 1-- + 右降 E 键，左拇指用 B 本位键；若老师教拇指降 B，请统一课程提示。",check:"知道普通 B 与降 B 的音高、谱位及指法关系。"},
{id:43,title:"还原号说，回到原来的音",goal:"理解还原号与临时变音的基本范围。",say:"同一小节里，同一高度的音会记住前面的升降号。还原号来了，它就回到本来的自然音。",steps:["第一条谱：升 F 后面的 F 没再写升号，仍吹升 F；看到还原号，再吹普通 F。","第二条谱：过了小节线，前一小节的临时升号不再管后面的 F。","先指谱说明每个 F 的声音，再慢听核对。本课没有跨小节延音。"],score:"natural",compare:[["同小节里，遇到还原号","natural"],["过小节线，临时记号结束","bar-reset"]],diagram:"accidentals",practice:"谁还记得升号？",task:"同一小节同一八度的 F，前面有升号，后面没有新记号时吹什么？",choices:["仍吹升 F","自动变回 F"],answer:0,feedback:"同小节同八度继续受影响，直到新记号改变它，或小节结束。",parent:"基础范围是同小节、同音名且同八度；调号另有范围。延音线跨小节等细节不放进本课规则练习。",check:"能根据前文记号而不是只看当前符头来判断音高。"},
{id:44,title:"谱子开头的小约定",goal:"初步区别调号与临时升降号。",say:"有的升降号住在拍号前面，像整段音乐的约定。看到它，要记得哪些音有变化。",steps:["第一条谱开头一个升号：本例是 G 大调调号，所有八度的 F 默认升半音。","第二条谱开头一个降号：本例是 F 大调调号，所有八度的 B 默认降半音。","先读每个变化音，再听短曲。本课只认这两个调号，不背完整音阶。"],score:"key-g",compare:[["一个升号 · G 大调示例","key-g"],["一个降号 · F 大调示例","key-f"]],diagram:"keys",practice:"小节线能取消调号吗？",task:"开头一个升号的调号，过小节线后 F 还默认升高吗？",choices:["仍然升高，除非有新记号改变","每过一条小节线就取消"],answer:0,feedback:"调号会继续有效；小节内的临时还原等记号可以暂时改变它。",parent:"一个升号也可对应 e 小调、一个降号也可对应 d 小调；本课用大调语境，不宣称调号能唯一判定调式。",check:"能区分谱首调号与音符旁临时记号的作用。"},
{id:45,title:"一张没见过的小乐谱",goal:"按准备步骤慢速视奏四小节。",say:"新的谱子也可以慢慢认识。先看看有哪些朋友、怎么走，再开始吹。",steps:["先别点示范。找拍号、最高音和最低音，指出八分音符与休止符。","默读音名，拍节奏；选比平时更慢的速度，只试第一句。","再听示范核对。找出一个想改进的地方，练那一小段。"],score:"sightread",practice:"视奏的第一步",task:"面对新谱，先做什么？",choices:["观察拍号、音域和节奏","先反复听到会背，再看谱"],answer:0,feedback:"先用眼睛探索，再尝试。之后听示范可以帮助核对。",parent:"视奏课保留播放按钮供尝试后核对，不把已听熟后背奏当视奏成绩。错误处少量分练。",check:"能独立做读谱准备，并在慢速下尝试一小句。"},
{id:46,title:"写下自己的两句音乐",goal:"用八个一拍位置创编两小节。",say:"这次你来做小作曲家。两间四拍的小房子，一共八个位置，放音符，也可以留安静。",steps:["打开下面的创编小工具，先选自己熟悉的一组音。","每点一个音或休止，就写入一拍。凑满八拍，就是两小节 4/4。","听一听，撤回一个不喜欢的音，再给家人演奏一小句。"],score:"compose-example",tool:"compose",practice:"我的两间小房子",task:"两小节 4/4，每个位置一拍，一共要放几拍？",choices:["四拍","八拍"],answer:1,feedback:"一间四拍，两间八拍。安静的那一拍也算进去。",parent:"工具固定每次一拍，先限制音高选择，避免同时设计复杂节奏。可以接受重复、安静和不以主音结束的探索。",check:"能写满八拍，并说出自己最喜欢的一处。"},
{id:47,title:"和家人一起合奏",goal:"听预备拍，与稳定节拍一起进入。",say:"家人可以拍稳定的脚步，你来吹旋律。先听四下准备，我们再一起出发。",steps:["请家人先均匀拍手。听完一小节四拍预备，下一拍进入。","先听“旋律与节拍”，再只播放“搭档节拍”，自己吹旋律。","有人错了也别急，继续听脚步；一起练习开始和结束。"],score:"duet",tool:"duet",practice:"什么时候进入？",task:"本课四拍预备结束后，我们在哪一拍开始？",choices:["接下来的第一拍","预备拍的第二拍就抢着吹"],answer:0,feedback:"听完四拍准备，接下来的第一拍一起进入。",parent:"这里用家人拍手或网页节拍作合奏伙伴。先短句，出错后尽量恢复；不能听清伴奏就先降低示范音量。",check:"能等待预备拍，并与搭档一起结束。"},
{id:48,title:"我的小小音乐会",goal:"分享两首短曲，并回顾自己的成长。",say:"今天请家人来听。深呼吸不用很夸张，舒服地站好，把喜欢的音乐送给他们。",steps:["从曲谱盒选择《森林来信》和《月光小摇篮》，先复习最想再练的两小节。","想好开始、换气和结束的位置。分开演奏两首，中间休息。","还可以分享自己编的两小节。结束后说一个进步和一个还想探索的问题。"],score:"concert-one",compare:[["森林来信 · 八小节","concert-one"],["月光小摇篮 · 八小节","concert-two"]],tool:"concert",practice:"音乐会之后",task:"哪一种发现最值得带走？",choices:["我愿意分享，也知道下次想练哪里","必须没有一个错音才算学会"],answer:0,feedback:"愿意表达、懂得倾听、知道怎么继续练，就是珍贵的成长。",parent:"不是考级或演奏能力认证。整套启蒙完成后，根据实际舒适度和老师反馈，继续扩展音域、音阶、调性与更复杂节奏。",check:"能分享适合当前程度的曲子，并说出具体进步。"}
];
advanced.forEach(l=>{l.unit=Math.floor((l.id-1)/4);l.duration=l.id>=45?"10 分钟":"8 分钟";l.kind=l.note?"note":"score";l.prereq=l.id>13?"先复习第 "+(l.id-1)+" 课的声音或记号，再试今天的新内容。":"先熟悉 B、A、G 的谱位与基本指法。";LESSONS.push(l)});
COURSE_UNITS.forEach((u,i)=>{u.lessons=Array.from({length:4},(_,j)=>i*4+j+1);u.tag=i<3?u.tag:["节奏起步","低音新朋友","向上探索","节奏游戏","音乐短句","声音表情","读谱进阶","升降小变化","分享音乐"][i-3];u.art=i<3?u.art:"score";u.score=LESSONS[i*4]?.score;});
window.NOTE_GROUPS=[

];

{id:"waltz",title:"三拍摇一摇",beats:[1,1,1],meter:3}
];

{id:"rhythm-friends",title:"三个朋友走节奏",subtitle:"一拍、两拍与安静",score:"three-friends",unit:3,tip:"把每小节四拍数匀，先分两小节练。"},
{id:"forest-steps",title:"森林的小台阶",subtitle:"低音区的上下行",score:"forest-steps",unit:4,tip:"注意 D4 的右小指离键，再回到 E4。"},
{id:"high-branch",title:"高高的树枝",subtitle:"从 G4 走到 E5",score:"high-branch",unit:5,tip:"C5 与 D5 的换指先静默练，再配气流。"},
{id:"rhythm-walk",title:"三拍小旅行",subtitle:"八分音符加入三拍子",score:"rhythm-walk",unit:6,tip:"两个均匀小音放在同一拍，长音继续数。"},
{id:"sentence",title:"一句音乐小故事",subtitle:"连音、分开起音与换气",score:"musical-sentence",unit:7,tip:"先圈出连音线，只练一句再连接。"},
{id:"repeat-walk",title:"再走一次的小路",subtitle:"按反复记号奏两遍",score:"repeat",unit:8,tip:"一、二小节奏两遍，共四小节的播放长度。"},
{id:"picnic",title:"记号野餐",subtitle:"附点与延音线",score:"reading-picnic",unit:9,tip:"跨小节的 A 持续不断，最后的 G 是三拍。"},
{id:"key-f",title:"降 B 来做客",subtitle:"一个降号的调号",score:"key-f",unit:10,tip:"看到谱首降号，记得这段里的 B 默认是降 B。"},
{id:"concert-one",title:"森林来信",subtitle:"八小节音乐会作品",score:"concert-one",unit:11,tip:"轻轻开始，在休止处自然换气。"},
{id:"concert-two",title:"月光小摇篮",subtitle:"三拍子的八小节作品",score:"concert-two",unit:11,tip:"轻轻摇出三拍分组，让长音保持稳定。"}

window.drawScore=function(scoreOrId,{labels=true}={}){const sc=typeof scoreOrId==="string"?SCORES[scoreOrId]:scoreOrId;if(!sc)return "";let globalIndex=0;const flat=sc.bars.flat();const measures=sc.bars.map((bar,bi)=>{const startIndex=globalIndex,w=Math.max(355,154+bar.length*56),start=sc.key?128:116,end=w-(sc.repeat?62:45),spacing=(end-start)/Math.max(1,bar.length-1);const xs=bar.map((_,i)=>bar.length===1?(start+end)/2:start+i*spacing);let b=staffLines(20,w-18)+treble(40,120)+keyGlyph(sc.key,65)+'<text x="'+(sc.key?97:78)+'" y="92" text-anchor="middle" font-size="23" fill="'+ink+'">'+sc.meter+'</text><text x="'+(sc.key?97:78)+'" y="119" text-anchor="middle" font-size="23" fill="'+ink+'">4</text><line x1="'+(w-20)+'" y1="60" x2="'+(w-20)+'" y2="140" stroke="#6f8365" stroke-width="1.7"/>';const beams={},accidentalState={};let beat=0;for(let i=0;i<bar.length;i++){const e=bar[i],next=bar[i+1];if(e.n&&next?.n&&e.b===.5&&next.b===.5&&Math.abs(beat-Math.round(beat))<1e-6){const dir=(noteY(e.n)+noteY(next.n))/2<=100?"down":"up",y=dir==="up"?Math.min(noteY(e.n),noteY(next.n))-42:Math.max(noteY(e.n),noteY(next.n))+42;beams[i]={dir,y,first:true};beams[i+1]={dir,y};i++;beat+=1}else beat+=e.b}

window.compilePerformance=function(scoreOrId,{bpm,countIn=0,pulse=false}={}){const sc=typeof scoreOrId==="string"?SCORES[scoreOrId]:scoreOrId;const tempo=bpm||sc.bpm||64,spb=60/tempo,base=sc.bars.flat(),events=[];let beat=countIn;for(let rep=0;rep<(sc.repeat?2:1);rep++){const slurLinks=new Set();let offset=0;sc.bars.forEach((bar,bi)=>{(sc.slurs||[]).filter(s=>s.bar===bi).forEach(s=>{for(let j=s.from;j<s.to;j++)slurLinks.add(offset+j)});offset+=bar.length});let group=null;base.forEach((e,i)=>{const start=beat*spb,duration=e.b*spb,prev=base[i-1],join=i>0&&e.n&&prev.n&&(prev.tie||slurLinks.has(i-1));if(!e.n)group=null;else{if(!join||!group){group={start,parts:[],duration:0};events.push(group)}group.parts.push({n:e.n,offset:start-group.start,duration,volume:e.v??sc.volume??.13,index:i});group.duration=start+duration-group.start;group.gate=join ? .96 : .88;}beat+=e.b});}

function playgroundPage(){const notes=activeNotes();return heading("NOTE PLAYGROUND · 音符游乐场","和今天学的音符交朋友","先选一组熟悉的音。慢慢听、慢慢找，不需要一次记住所有朋友。")+groupPicker('group',activeGroup)+'<section class="note-lab"><div class="lab-header"><div><h2>五线谱上的小房子</h2><p>点音符，听声音；线和间从下面数起。</p></div><button class="button light small" data-demo-notes>▶ 听这一组</button></div><div class="lab-body"><div class="staff-wrap">'+drawStaff(notes,{interactive:true})+'</div><div class="note-choices">'+notes.map(n=>'<button class="note-key" data-note="'+n+'">'+noteLabel(n)+'<small>'+NOTES[n].position+'</small></button>').join('')+'</div><p class="lab-caption">这一组的音：'+notes.join(' · ')+'。数字标明音区，C5 比 B4 高一小步。</p></div></section><div class="section-title"><div><h2>选一个小游戏</h2><p>不用计时，答错了也可以再试。</p></div></div><div class="game-tabs" role="group" aria-label="选择小游戏">'+[['staff','音符捉迷藏'],['ear','听音找朋友'],['rhythm','拍拍小火车']].map(([t,n])=>'<button data-game="'+t+'" class="'+(game.type===t?'active':'')+'" aria-pressed="'+(game.type===t)+'">'+n+'</button>').join('')+'</div><div id="game-container">'+gameHTML()+'</div><div class="hint">电子音只示范音高与节奏。真实音色、口型和吐音，跟着老师慢慢找。</div><div class="section-title"><div><h2>手指也来认识一下</h2><p>先看图、做指法，再短短吹一吹。</p></div></div><div class="finger-grid">'+notes.map(n=>'<article class="finger-card"><div><h3>'+noteLabel(n)+'</h3><p>'+n+'</p><button class="button small light" data-note="'+n+'">▶ 听音</button><p><a href="#lesson/'+NOTES[n].lesson+'">去这一课 →</a></p></div>'+drawFingering(n)+'</article>').join('')+'</div><p class="local-note">常见波姆体系指法，左拇指用 B 本位键。右拇指支撑，左小指放开。D4、D5 的右小指离键，B♭4 使用 1+1 指法。具体儿童型号请老师核对。</p>'}
function gameHTML(){if(game.type==='rhythm'){const p=RHYTHM_PATTERNS[rhythmIndex];return '<section class="game-card"><span class="pill">脚步均匀 · 安静也数拍</span><h2 style="margin-top:16px">拍拍小火车</h2><div class="game-tabs pattern-tabs">'+RHYTHM_PATTERNS.map((p,i)=>'<button data-pattern="'+i+'" class="'+(i===rhythmIndex?'active':'')+'">'+p.title+'</button>').join('')+'</div>'+drawScore(rhythmScore())+'<p>先听示范，再用拍手模仿；休止符那里安静一下。</p><div class="beat-dots">'+Array.from({length:p.meter||4},(_,i)=>'<span class="beat-dot" data-beat="'+i+'">'+(i+1)+'</span>').join('')+'</div><div class="game-controls"><button class="button" data-beats>▶ 听节奏</button><button class="button secondary" data-tap>拍拍手 · '+(game.taps||0)+'</button><button class="button secondary" data-stop>■ 停一下</button></div><div class="game-feedback" aria-live="polite" id="game-feedback">点按只记录尝试，不评判准不准。用耳朵和家人一起比较。</div></section>'}const ear=game.type==='ear';return '<section class="game-card"><span class="pill">'+(ear?'先听声音，再找朋友':'看看谱位，找到朋友')+'</span><h2 style="margin-top:15px">'+(ear?'你听见了哪位朋友？':'这个音符是谁？')+'</h2>'+(ear?'<div style="margin:28px"><button class="button" data-hear>▶ 听神秘音符</button></div><p>可以先回到上面的音符卡，比较这一组的声音。</p>':'<div class="staff-wrap">'+drawStaff([game.target],{labels:false})+'</div>')+'<div class="note-choices">'+activeNotes().map(n=>'<button class="note-key" data-guess="'+n+'">'+noteLabel(n)+'<small>'+n+'</small></button>').join('')+'</div><div class="game-feedback" id="game-feedback" aria-live="polite">慢慢想，可以试不止一次。</div><div class="game-controls"><button class="button secondary small" data-game-next>换一个朋友 →</button></div><div class="game-count">已经认识了 '+game.found+' 次小音符</div></section>'}
function songCard(s){if(s.compose)return composerHTML();return '<article class="song-card" data-song-card="'+s.id+'"><span class="pill">'+(s.score?'单元 '+(s.unit+1)+' · 原创练习':'起步 · 音序练习')+'</span><h2>'+s.title+'</h2><p>'+s.subtitle+'</p><div class="song-score">'+(s.score?drawScore(s.score):drawStaff(s.notes,{interactive:true}))+'</div><p>'+s.tip+'</p><label class="speed-label">练习速度 <input type="range" min="40" max="90" value="60" step="5" data-speed="'+s.id+'" aria-label="'+s.title+'的练习速度"><span id="speed-'+s.id+'">60</span> 拍/分</label><div class="action-row"><button class="button small" data-song="'+s.id+'">▶ 听完整旋律</button><button class="button secondary small" data-song="'+s.id+'" data-phrase>听前一句</button><button class="button secondary small" data-stop>■ 停一下</button></div><p class="audio-caption">电子音高与节奏示范 · 可分句吹奏，按标记和休止自然换气。</p></article>'}
function songsPage(){return heading("MY LITTLE MELODIES · 我的曲谱盒","把小小的声音，连成音乐","从三个音到两首八小节作品。挑今天学过的曲子，先看谱，再分句练。")+'<div class="stage-links">'+['全部','起步 · 单元1—3','音符与节奏 · 单元4—7','表达与读谱 · 单元8—11','小小音乐会'].map((t,i)=>'<button class="button secondary small '+(songFilter===i?'selected':'')+'" data-song-filter="'+i+'">'+t+'</button>').join('')+'</div><div class="songs-grid">'+SONGS.filter(s=>!s.compose&&(songFilter===0||songFilter===1&&!s.score||songFilter===2&&s.unit>=3&&s.unit<=6||songFilter===3&&s.unit>=7&&s.unit<=10||songFilter===4&&s.unit===11)).map(songCard).join('')+'</div>'+composerHTML()+'<div class="hint">这些短曲为本教程原创练习。可以打印当前曲谱；速度可调，随时停下。先把身体和声音练舒服，再增加长度。</div>'}
function parentsPage(){const checks=["已请老师确认弯头朝向、口型和持笛支点","谱架与座椅合适，孩子双脚有支撑","了解具体乐器的组装与弯管清洁方法","愿意每次只观察和反馈一个重点"];return heading("GROWN-UPS CORNER · 家长陪练角","陪她发现音乐，也陪她慢慢来","这是一套日常启蒙与复习工具。12 个单元、48 节微课均可学习，技术动作请与老师的指导保持一致。")+'<div class="parent-grid"><section class="parent-card"><h2>开始之前，准备这四件事</h2>'+checks.map((c,i)=>'<label class="parent-check"><input type="checkbox" data-parent-check="'+i+'" '+(saved.checks.includes(i)?"checked":"")+'><span>'+c+'</span></label>').join("")+'<p class="local-note">勾选仅记录在当前设备，不代表网站已核验动作。</p></section><section class="parent-card"><h2>一次轻松的陪练</h2><ol><li>听一个短示范，问她发现了什么。</li><li>看看图，拍一拍或做静默指法。</li><li>短短吹几次，中间放下乐器休息。</li><li>说出一个具体进步，结束在愿意再试的时候。</li></ol><p>起初约 5—8 分钟，逐渐增加到 10—15 分钟，含听、唱和休息。不是连续吹奏的时长要求。</p></section><section class="parent-card"><h2>遇到这些情况</h2><details open><summary>一直只有气声，怎么办？</summary><p>先休息，回到笛头短尝试。请老师检查下唇与吹孔位置、气流方向及乐器，不让孩子靠猛吹解决。找声音可以花几次课。</p></details><details><summary>手臂累、肩膀耸起来了？</summary><p>先放下长笛。改做听辨、拍手或读谱；请老师调整弯头和持笛支点。疼痛或头晕时停止吹奏。</p></details><details><summary>认谱比吹奏快，或反过来？</summary><p>很正常。两条线可以分别推进。识谱熟练不等于口型已经掌握，也不需要等吹得完美才开始听辨。</p></details><details><summary>点了播放或朗读，没有声音？</summary><p>先检查右上角是否静音，以及设备音量。朗读依赖浏览器的中文语音；不支持时可以由家长朗读，图文仍可使用。</p></details></section><section class="parent-card"><h2>怎么知道她在进步？</h2><ul><li>能听出今天学的声音区别。</li><li>能在较少提醒下找到谱位或指法。</li><li>身体较放松，愿意分句再试一次。</li></ul><p>“你在安静的地方等到了下一拍。”这样的具体反馈，比一次纠正很多地方更容易理解。</p><p>页面的“小叶子”代表尝试记录，不是考试成绩。不设倒计时、排行榜或连续打卡惩罚。</p></section><section class="parent-card"><h2>关于声音、图示与指法</h2><p>声音为电子合成示范，用于音高与节奏。它不替代老师真实的长笛音色、口型或吐音示范。所有插图为概念示意，尚未经过她的授课老师核对。</p><p>高音谱表中的 B4 在第三线、A4 在第二间、G4 在第二线。指法按常见波姆体系绘制；左拇指使用 B 本位音键。D4 与 D5 的右小指放开，D5 的左食指也放开；降 B 使用 1+1 指法。具体儿童型号以老师指导为准。</p><p><a href="https://www.phyllislouke.com/wp-content/uploads/2015/08/Flute-101-Sample-Pages-from-Presser.pdf" target="_blank" rel="noopener" class="text-link">参考：Flute 101 入门样章 ↗</a><br><a href="https://www.yamaha.com/en/musical_instrument_guide/common/images/flute/fingering.pdf" target="_blank" rel="noopener" class="text-link">参考：Yamaha 长笛指法表 ↗</a></p></section><section class="parent-card"><h2>我们的学习记录</h2><p>已经探索 <strong>'+saved.done.length+' / 48</strong> 节微课。进度、陪练准备和自编旋律只保存在当前浏览器中。</p><p>不需要填写孩子的姓名，不使用麦克风，也不上传声音。更换设备或清除浏览器数据后，记录不会自动同步。</p><a class="button secondary" href="#map">看看课程记录 →</a><p class="local-note">每个单元可以重复几次。48 课不是 48 天的进度要求；技术与读谱可以按孩子状态分别推进。</p></section></div>'}
function render(){stopSound();const route=location.hash.slice(1)||"home";let tab=route.split("/")[0],title={home:"今天学什么",map:"课程地图",play:"音符游乐场",songs:"我的曲谱盒",parents:"家长陪练角",lesson:"微课时间"}[tab]||"今天学什么";if(tab==="lesson")main.innerHTML=lessonPage(Number(route.split("/")[1]));else main.innerHTML=({home:homePage,map:mapPage,play:playgroundPage,songs:songsPage,parents:parentsPage}[tab]||homePage)();$("#page-label").textContent=title;document.title=title+" · 小小长笛家";document.querySelectorAll("[data-nav]").forEach(a=>{const active=a.dataset.nav===(tab==="lesson"?"map":tab);a.classList.toggle("active",active);if(active)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});window.scrollTo(0,0);updateSoundButton()}
function refreshGame(){stopSound();$("#game-container").innerHTML=gameHTML();document.querySelectorAll("[data-game]").forEach(b=>{b.classList.toggle("active",b.dataset.game===game.type);b.setAttribute("aria-pressed",String(b.dataset.game===game.type))})}
function refreshComposition(){const e=$('#composition-staff');if(e)e.innerHTML=compositionView();const c=$('#composition-count');if(c)c.textContent=saved.composition.length+' / 8 拍';}
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-note]");if(!b)return;
if(b.id==="sound-toggle"){saved.muted=!saved.muted;stopSound();persist();updateSoundButton();return}
if(b.matches("[data-stop]")){stopSound();return}
if(b.dataset.note){playNote(b.dataset.note);return}
if(b.dataset.read){const l=LESSONS[Number(b.dataset.read)-1];if(l)speak(l.title+"。"+l.say+"。"+l.steps.join("。"));return}
if(b.dataset.demo){const l=LESSONS[Number(b.dataset.demo)-1];if(l?.demo)playSequence(l.demo,{durations:l.durations,button:b});return}
if(b.matches("[data-demo-notes]")){playSequence(activeNotes(),{button:b});return}
if(b.dataset.lesson){const l=LESSONS[Number(b.dataset.lesson)-1],answer=Number(b.dataset.answer),correct=l.answer==="any"||answer===l.answer;const fb=$("#lesson-feedback");fb.textContent=correct?l.feedback:"再看一看上面的图或听一次示范，想好了再试。";if(correct){document.querySelectorAll("[data-answer]").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}return}
if(b.dataset.complete){const id=Number(b.dataset.complete);if(!saved.done.includes(id)){saved.done.push(id);persist()}toast(saved.done.length===LESSONS.length?"48 课都留下脚印啦！可以继续重玩最喜欢的一课。":id===LESSONS.length?"音乐会这一课也留下脚印啦！回地图看看其他小发现。":"收下一片小叶子。随时可以回来再试。");location.hash=id<LESSONS.length?"lesson/"+(id+1):"map";return}
if(b.dataset.unit){const i=Number(b.dataset.unit),u=COURSE_UNITS[i];$("#dialog-body").innerHTML='<span class="eyebrow">后续课程计划 · 单元 '+(i+1)+'</span><h2 id="dialog-title" style="margin-top:16px">'+u.title+'</h2><p>'+u.subtitle+'</p><ul>'+u.goals.map(g=>'<li>'+g+'</li>').join("")+'</ul><p>这个单元尚未开放。可以先在已开放的课程里，把声音、姿势和三个音符练熟。</p><a class="button" href="#map" data-close-dialog>回到已开放课程</a>';$("#unit-dialog").showModal();return}
if(b.classList.contains("dialog-close")){$("#unit-dialog").close();return}
if(b.dataset.game){game.type=b.dataset.game;game.answered=false;game.taps=0;refreshGame();return}
if(b.matches("[data-hear]")){playSequence([game.target],{button:b});return}
if(b.dataset.guess){if(game.answered)return;if(b.dataset.guess===game.target){game.found++;game.answered=true;$("#game-feedback").textContent="找到啦，是 "+noteLabel(game.target)+"！可以再听一次，然后换个朋友。";b.classList.add("selected");document.querySelector(".game-count").textContent="已经认识了 "+game.found+" 次小音符";playNote(game.target)}else{$("#game-feedback").textContent=game.type==="staff"?"从下面数线和间，再看看音符旁有没有升降号。":"可以回到上面的音符卡，比较这一组声音，再试一次。"}return}
if(b.matches("[data-game-next]")){game.index=(game.index+1)%activeNotes().length;game.target=activeNotes()[game.index];game.answered=false;refreshGame();return}
if(b.matches('[data-beats]')){const sc=rhythmScore();playScore(sc,{bpm:70,button:b,container:b.closest('.game-card'),onTick:i=>document.querySelectorAll('.beat-dot').forEach((d,j)=>d.classList.toggle('on',i%sc.meter===j)),visualPulse:true});return}
if(b.matches('[data-tap]')){game.taps=(game.taps||0)+1;const meter=RHYTHM_PATTERNS[rhythmIndex].meter||4;document.querySelectorAll('.beat-dot').forEach((d,j)=>d.classList.toggle('on',(game.taps-1)%meter===j));b.textContent='拍拍手 · '+game.taps;return}
if(b.dataset.song){const s=SONGS.find(s=>s.id===b.dataset.song),card=b.closest('[data-song-card]'),bpm=Number(card.querySelector('input').value);if(s.score){const sc=SCORES[s.score],phrase=b.hasAttribute('data-phrase')?{...sc,bars:sc.bars.slice(0,2),repeat:false,slurs:sc.slurs?.filter(x=>x.bar<2)}:sc;playScore(phrase,{bpm,button:b,container:card})}else{const notes=b.hasAttribute('data-phrase')?s.notes.slice(0,s.phrase):s.notes;playSequence(notes,{bpm,button:b,onNote:i=>card.querySelectorAll('.staff-note').forEach((n,j)=>n.classList.toggle('music-note-active',j===i))})}return}
if(b.dataset.compose){if(saved.composition.length>=8){toast('两间小房子已经装满 8 拍啦。先听听，或撤回一拍。');return}const n=b.dataset.compose==='rest'?null:b.dataset.compose;saved.composition.push(n);persist();refreshComposition();if(n)playNote(n);else stopSound();return}
if(b.matches('[data-play-composition]')){if(!saved.composition.length){toast('先放几个音或休止，编一段小音乐吧。');return}playScore(compositionScore(),{button:b,container:$('#composition-staff')});return}
if(b.matches("[data-undo-composition]")){stopSound();saved.composition.pop();persist();refreshComposition();return}
if(b.matches("[data-clear-composition]")){stopSound();saved.composition=[];persist();refreshComposition();return}
});
document.addEventListener("click",e=>{if(e.target.closest("[data-close-dialog]"))$("#unit-dialog").close();if(e.target.closest(".skip")){e.preventDefault();main.focus();main.scrollIntoView({block:"start"})}});
document.addEventListener("keydown",e=>{const n=e.target.closest(".staff-note[role=button]");if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();playNote(n.dataset.note)}});
document.addEventListener("input",e=>{if(e.target.matches("[data-speed]")){stopSound();$("#speed-"+e.target.dataset.speed).textContent=e.target.value}});
document.addEventListener("change",e=>{if(e.target.matches("[data-parent-check]")){const i=Number(e.target.dataset.parentCheck);saved.checks=saved.checks.filter(x=>x!==i);if(e.target.checked)saved.checks.push(i);persist()}});
$("#unit-dialog").addEventListener("click",e=>{if(e.target===$("#unit-dialog")){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
window.addEventListener("hashchange",()=>{render();main.focus({preventScroll:true})});
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopSound()});
window.addEventListener("pagehide",stopSound);

let activeGroup='first',composeGroup='first',rhythmIndex=0,songFilter=0;
function activeNotes(){return NOTE_GROUPS.find(g=>g.id===activeGroup).notes}
function groupPicker(kind,value){return '<div class="game-tabs group-picker" role="group" aria-label="选择音符组">'+NOTE_GROUPS.map(g=>'<button data-'+kind+'="'+g.id+'" class="'+(g.id===value?'active':'')+'" aria-pressed="'+(g.id===value)+'">'+g.title+'</button>').join('')+'</div>'}
function unitArt(u){return ART[u.art]?ART[u.art]():drawStaff(SCORES[u.score].bars[0].filter(e=>e.n).slice(0,3).map(e=>e.n),{labels:false})}
function rhythmScore(){const p=RHYTHM_PATTERNS[rhythmIndex];return {meter:p.meter||4,bars:[p.beats.map((b,i)=>N(p.rests?.includes(i)?null:'G4',b))]}}
function compositionScore(){const notes=[...saved.composition];while(notes.length<8)notes.push(null);return {meter:4,bars:[notes.slice(0,4).map(n=>N(n)),notes.slice(4).map(n=>N(n))]}}
function compositionView(){return drawScore(compositionScore())+'<p class="local-note">'+(saved.composition.length<8?'还没填写的位置暂用一拍休止占位；继续点音符即可填入。':'两小节都装满了，可以听听，再试着演奏。')+'</p>'}
function composerHTML(){return '<section class="song-card composer"><span class="pill">原创小作曲家 · 两小节 4/4</span><h2>写给今天的自己</h2><p>一个音或一次安静，占一拍。选自己熟悉的一组，写满八拍。</p><div id="compose-picker">'+groupPicker('compose-group',composeGroup)+'</div><div id="compose-keys">'+composerKeys()+'</div><p id="composition-count" class="composition-count">'+saved.composition.length+' / 8 拍</p><div id="composition-staff">'+compositionView()+'</div><div class="action-row"><button class="button small" data-play-composition>▶ 听我的音乐</button><button class="button secondary small" data-stop>■ 停一下</button><button class="button secondary small" data-undo-composition>撤回一拍</button><button class="button secondary small" data-clear-composition>重新编一段</button></div><p>旋律保存在当前浏览器。空白位置会作为休止播放，继续填写即可替换。</p></section>'}
function composerKeys(){return '<div class="note-choices">'+NOTE_GROUPS.find(g=>g.id===composeGroup).notes.map(n=>'<button class="note-key" data-compose="'+n+'">'+noteLabel(n)+'<small>'+n+'</small></button>').join('')+'<button class="note-key rest-key" data-compose="rest">休止<small>安静一拍</small></button></div>'}
function scoreControls(id,label='听这段音乐'){return '<button class="button light" data-score="'+id+'">▶ '+label+'</button>'}
function lessonExtras(l){if(!l.score)return '';let h=l.note?'<div class="exercise-score">'+drawScore(l.score)+'</div>':'';h+='<div class="action-row">'+scoreControls(l.score)+'<button class="button secondary small" data-toggle-labels aria-pressed="'+(l.id===45)+'">'+(l.id===45?'显示音名':'藏起音名')+'</button><button class="button secondary" data-stop>■ 停一下</button></div><p class="audio-caption">电子示范音 · 用来听音高、时值与连接，不替代真实长笛的技术示范。</p>';if(l.compare)h+='<div class="comparison-scores">'+l.compare.map(([label,id])=>'<details><summary>'+label+'</summary>'+drawScore(id)+'<div class="action-row">'+scoreControls(id,label)+'<button class="button secondary small" data-stop>■ 停一下</button></div></details>').join('')+'</div>';if(l.tool==='compose')h+=composerHTML();if(l.tool==='duet')h+='<section class="ensemble-card"><h3>一起出发的小搭档</h3><p>四拍预备 → 四小节合奏。起初每分钟 60 拍。</p><div class="action-row"><button class="button small" data-duet="both">▶ 旋律与节拍</button><button class="button secondary small" data-duet="pulse">▶ 只听搭档节拍</button><button class="button secondary small" data-stop>■ 停一下</button></div><p id="count-in" aria-live="polite">先放松肩膀，准备好再点播放。</p></section>';if(l.tool==='concert')h+='<div class="hint"><strong>给家人的音乐邀请</strong><p>① 先说曲名　② 舒服地吹一首　③ 放下长笛休息　④ 再分享一首　⑤ 说一个自己的进步。</p><a class="text-link" href="#songs">到曲谱盒选曲 →</a></div>';return h}
function voice(group,base){const time=base+group.start,last=group.parts.at(-1),end=time+group.duration-Math.min(.06,last.duration*(1-group.gate));[1,2,3].forEach((harmonic,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),weight=[1,.12,.025][i];o.type='sine';group.parts.forEach((p,j)=>{const t=time+p.offset,level=p.volume*weight;o.frequency.setValueAtTime(noteFrequency(p.n)*harmonic,t);if(j===0){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(level,t+.025)}else{g.gain.linearRampToValueAtTime(level,t+.025)}});g.gain.setValueAtTime(last.volume*weight,Math.max(time+.03,end-.045));g.gain.linearRampToValueAtTime(0,end);o.connect(g);g.connect(audioCtx.destination);o.start(time);o.stop(end+.01);o.onended=()=>{o.disconnect();g.disconnect()};oscillators.push(o)})}
function tick(time,accent){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=accent?1000:740;g.gain.setValueAtTime(.08,time);g.gain.exponentialRampToValueAtTime(.001,time+.05);o.connect(g);g.connect(audioCtx.destination);o.start(time);o.stop(time+.06);o.onended=()=>{o.disconnect();g.disconnect()};oscillators.push(o)}
async function playScore(score,{bpm,button,container=main,countIn=0,pulse=false,pulseOnly=false,visualPulse=false,onTick}={}){stopSound();const token=audioToken;if(!await ensureAudio()||token!==audioToken)return;const p=compilePerformance(score,{bpm,countIn,pulse}),base=audioCtx.currentTime+.08;if(button)button.classList.add('audio-playing');if(!pulseOnly)p.events.forEach(g=>voice(g,base));p.ticks.forEach(t=>tick(base+t.start,t.accent));p.highlights.forEach(h=>audioTimers.push(setTimeout(()=>{if(token!==audioToken)return;container.querySelectorAll('.score-event').forEach(n=>n.classList.toggle('music-note-active',Number(n.dataset.event)===h.index));},80+h.start*1000)));if(countIn){const label=$('#count-in');for(let i=0;i<countIn;i++)audioTimers.push(setTimeout(()=>{if(label&&token===audioToken)label.textContent='预备 · '+(i+1)},80+i*p.spb*1000));audioTimers.push(setTimeout(()=>{if(label&&token===audioToken)label.textContent='一起开始！跟着稳定的脚步。'},80+countIn*p.spb*1000))}if(visualPulse)for(let i=0;i<p.totalBeats;i++)audioTimers.push(setTimeout(()=>{if(token===audioToken)onTick?.(i)},80+i*p.spb*1000));audioTimers.push(setTimeout(()=>{if(token!==audioToken)return;stopSound();const label=$('#count-in');if(label)label.textContent='一起结束啦。放下长笛，休息一下。'},p.duration*1000+120))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-toggle-labels')){const panel=b.closest('.lesson-panel');const hidden=panel.classList.toggle('hide-note-labels');b.textContent=hidden?'显示音名':'藏起音名';b.setAttribute('aria-pressed',String(hidden));return}if(b.dataset.stage!==undefined){$('#unit-'+b.dataset.stage)?.scrollIntoView({behavior:'smooth',block:'start'});return}if(b.dataset.score){const container=b.closest('details')||b.closest('.lesson-panel');playScore(b.dataset.score,{button:b,container});return}if(b.dataset.duet){playScore('duet',{bpm:60,button:b,container:b.closest('.lesson-panel'),countIn:4,pulse:true,pulseOnly:b.dataset.duet==='pulse'});return}if(b.dataset.group){activeGroup=b.dataset.group;game.target=activeNotes()[0];game.index=0;game.answered=false;render();return}if(b.dataset.composeGroup){composeGroup=b.dataset.composeGroup;$('#compose-picker').innerHTML=groupPicker('compose-group',composeGroup);$('#compose-keys').innerHTML=composerKeys();return}if(b.dataset.pattern!==undefined){rhythmIndex=Number(b.dataset.pattern);game.taps=0;refreshGame();return}if(b.dataset.songFilter!==undefined){songFilter=Number(b.dataset.songFilter);render();return}});
render();

</script></body></html>
